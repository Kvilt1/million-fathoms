<canvas id="scene" aria-hidden="true"></canvas>
<div class="app" id="app">
  <div class="top">
    <h1 class="brand" style="margin:0">Million Fathoms</h1>
    <div class="modes" role="group" aria-label="Game mode">
      <button id="modeFree" aria-pressed="true">Free dive</button>
      <button id="modeDive" aria-pressed="false">10-roll dive</button>
    </div>
    <div class="stats">
      <div class="stat" id="sRolls"><b>0</b><span>Rolls</span></div>
      <div class="stat opt" id="sBest"><b>0</b><span>Best EP</span></div>
      <div class="stat opt" id="sLife"><b>0</b><span>Lifetime EP</span></div>
      <div class="stat" id="sBadges"><b>0/233</b><span>Badges</span></div>
    </div>
    <button class="icon-btn" id="btnSound" aria-pressed="true" aria-label="Sound">
      <svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4V5.500l-5 4H4z"/><path id="soundWaves" d="M16.500 9a4 4 0 0 1 0 6M19 6.500a8 8 0 0 1 0 11"/></svg>
    </button>
  </div>

  <section class="console" aria-label="Roll console">
    <div class="run" id="run" hidden>
      <div class="pips" id="pips"></div>
      <span>Dive total <b id="runTotal">0</b> EP</span>
    </div>
    <div class="machine">
      <div class="reels" id="reels" aria-hidden="true"></div>
    </div>
    <div class="readout">
      <div class="ep" id="ep">0 <small>EP</small></div>
      <div class="stamp" id="stamp"></div>
      <div class="meta" id="meta">0 to 1,000,000. Every roll counts.</div>
    </div>
    <div class="controls">
      <button class="roll" id="btnRoll"><span id="rollLabel">Roll</span><kbd>Space</kbd></button>
      <div class="tools">
        <div class="seg" role="group" aria-label="Speed">
          <button data-speed="show" aria-pressed="true">Show</button>
          <button data-speed="fast" aria-pressed="false">Fast</button>
          <button data-speed="instant" aria-pressed="false">Instant</button>
        </div>
        <button class="auto" id="btnAuto" aria-pressed="false">Auto</button>
        <label><span class="lbl">stop at</span>
          <select id="autoStop" aria-label="Stop auto rolling at">
            <option value="9">never</option>
            <option value="3">Rare</option>
            <option value="4">Epic</option>
            <option value="5" selected>Anomaly</option>
            <option value="6">Mythic</option>
            <option value="new">a new badge</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <section class="haul" aria-label="Badges on this roll">
    <header><h2 id="haulTitle">Depth chart</h2><span id="haulCount"></span></header>
    <ul class="haul-list" id="haul"></ul>
  </section>

  <nav class="dock" aria-label="Sections">
    <button data-open="log">Log</button>
    <button data-open="codex">Badges<em id="dockBadges">0/233</em></button>
    <button data-open="sets">Sets<em id="dockSets">0/16</em></button>
    <button data-open="check">Check<span class="lg"> a number</span></button>
    <button data-open="how">How<span class="lg"> it scores</span></button>
    <button data-open="settings">Settings</button>
  </nav>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="whiteout" id="whiteout"></div>
<div class="zone-flash" id="zoneFlash" aria-hidden="true"></div>
<div class="toasts" id="toasts"></div>
<div class="sr" aria-live="polite" id="live"></div>
<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Game details">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane" tabindex="-1"></div>
  </div>
</div>
<div class="finish" id="finish" hidden></div>
